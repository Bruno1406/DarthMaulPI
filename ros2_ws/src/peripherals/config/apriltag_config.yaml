apriltag_detector:
  ros__parameters:
    image_transport: raw
    qos_profile: sensor_data

    family: Custom48h12
    size: 0.0162
    max_hamming: 0

    # Task 3 uses the detected image corners directly.
    # It does not consume AprilTag TF poses.
    pose_estimation_method: ""

    detector:
      threads: 1
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false

    # Upstream Jazzy apriltag_ros parameter names.
    # The nonempty frames list also enforces ID filtering.
    tag:
      ids:
        - 992
        - 993
        - 994
        - 995
        - 996
        - 997

      frames:
        - cube_face_992
        - cube_face_993
        - cube_face_994
        - cube_face_995
        - cube_face_996
        - cube_face_997

      sizes:
        - 0.0162
        - 0.0162
        - 0.0162
        - 0.0162
        - 0.0162
        - 0.0162
