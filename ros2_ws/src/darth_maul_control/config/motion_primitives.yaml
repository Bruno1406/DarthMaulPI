motion_primitive_server:
  ros__parameters:
    cell_length_m: 0.254

    default_position_tolerance_m: 0.08
    default_heading_tolerance_rad: 0.20

    default_linear_speed_mps: 0.08
    default_reverse_speed_mps: 0.06
    default_angular_speed_radps: 0.35

    max_linear_speed_mps: 0.12
    max_angular_speed_radps: 0.50

    timeout_margin_s: 3.0

    scan_topic: "/ldlidar_node/scan"
    odom_topic: "/odom"
    final_cmd_vel_topic: "/controller/cmd_vel"

    front_sector_deg: 35.0
    front_stop_distance_m: 0.13

    require_scan_for_forward: true
    require_odom_for_result_check: false

    nav2_drive_action: "/drive_on_heading"
    nav2_backup_action: "/backup"
    nav2_spin_action: "/spin"

behavior_server:
  ros__parameters:
    use_sim_time: false

    local_frame: "odom"
    global_frame: "odom"
    robot_base_frame: "base_footprint"
    transform_tolerance: 0.2
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false

    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"
      simulate_ahead_time: 1.0
      max_rotational_vel: 0.35
      min_rotational_vel: 0.05
      rotational_acc_lim: 0.70

    backup:
      plugin: "nav2_behaviors::BackUp"
      simulate_ahead_time: 1.0
      acceleration_limit: 0.20
      deceleration_limit: -0.30
      minimum_speed: 0.02

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      simulate_ahead_time: 1.0
      acceleration_limit: 0.20
      deceleration_limit: -0.30
      minimum_speed: 0.02

    wait:
      plugin: "nav2_behaviors::Wait"
