darth_maul_control:
  ros__parameters:
    # Topics
    odom_topic: "/odom"
    scan_topic: "/ldlidar_node/scan"
    cmd_vel_topic: "/controller/cmd_vel"
    status_topic: "/darth_maul_control/status"

    # Robot/maze constants
    cell_length_m: 0.254

    # Main loop
    control_rate_hz: 25.0

    # Default tolerances
    default_position_tolerance_m: 0.015
    default_heading_tolerance_rad: 0.04

    # Conservative speed limits for first real robot tuning
    default_linear_speed_mps: 0.070
    default_reverse_speed_mps: 0.050
    default_angular_speed_radps: 0.280

    max_linear_x_mps: 0.090
    max_linear_y_mps: 0.035
    max_angular_z_radps: 0.350

    # Minimum commands to overcome static friction.
    # These are only used while outside tolerance.
    min_linear_x_mps: 0.025
    min_angular_z_radps: 0.080

    # Capped-P gains
    k_distance: 0.80
    k_heading: 1.60

    # Acceleration limiting
    max_linear_accel_mps2: 0.18
    max_lateral_accel_mps2: 0.12
    max_angular_accel_radps2: 0.75

    # Sensor freshness
    odom_timeout_sec: 0.50
    scan_timeout_sec: 0.50

    # LiDAR front stop
    require_scan_for_forward: true
    front_sector_deg: 35.0
    front_stop_distance_m: 0.13

    # LiDAR cardinal-sector diagnostics.
    lidar_diagnostics_enabled: true
    lidar_diagnostic_sector_width_deg: 10.0
    lidar_diagnostic_min_samples: 3

    # Straight translation distance authority.
    # In final maze mode, straight distance is measured from raw front/rear
    # cardinal LiDAR range deltas, accepted only when the selected source is
    # internally consistent. Odom is diagnostic only because /odom is
    # command-integrated and can overreport by 50-70 mm over a 3-cell move.
    translation_progress_source: lidar_required

    # Pre-translation grid-yaw acquisition is experimental and disabled by default.
    # Real robot testing showed rotate-in-place pre-align can rotate the front
    # sector into an adjacent side wall and contaminate distance progress.
    pre_translation_grid_yaw_align_enabled: false

    # Trigger pre-alignment only when the absolute starting grid-yaw error is above this.
    # 0.035 rad ~= 2.0 deg.
    pre_translation_grid_yaw_align_start_threshold_rad: 0.035

    # Finish pre-alignment when the absolute grid-yaw error is at or below this for
    # a configured number of consecutive valid samples.
    # 0.015 rad ~= 0.86 deg.
    pre_translation_grid_yaw_align_target_rad: 0.015

    # Require this many consecutive valid, in-target grid-yaw samples before declaring
    # pre-alignment complete. This replaces timing-based settling.
    pre_translation_grid_yaw_align_stable_samples: 3

    # If pre-alignment has started and grid yaw becomes invalid/inactive for this
    # many consecutive samples, fail rather than driving forward on a bad heading.
    pre_translation_grid_yaw_align_max_invalid_samples: 3

    # In lidar_required mode, if LiDAR progress becomes invalid, hold zero velocity.
    # Allow this many consecutive invalid samples before failing.
    # This is sample/state based, not a wall-clock grace window.
    translation_lidar_required_invalid_max_consecutive_samples: 2

    # Maximum allowed disagreement between front and rear LiDAR progress.
    # If both are valid and disagree more than this, reject LiDAR progress.
    lidar_progress_max_disagreement_m: 0.025

    # Reject negative LiDAR progress below this threshold.
    lidar_progress_min_m: -0.010

    # Allow one valid source, front-only or rear-only, when the other side is invalid.
    # Needed for long corridors where only one cardinal reference is visible.
    lidar_progress_allow_single_source: true

    # Reject LiDAR progress if it is implausibly ahead of odom.
    # Odom is not trusted as truth, but it is still useful as a sanity bound.
    lidar_progress_max_ahead_of_odom_m: 0.060

    # Diagnostic warning threshold for odom/LiDAR disagreement.
    lidar_odom_warning_threshold_m: 0.020

    # LiDAR grid-alignment estimation.
    # Used for diagnostics and, when explicitly enabled below, low-gain straight-drive yaw correction.
    grid_alignment_diagnostics_enabled: true

    # Expected distance from robot centerline to one side wall when centered.
    # This is used only for one-wall lateral error diagnostics.
    grid_alignment_expected_half_width_m: 0.125

    # A geometrically valid side-wall line is only an adjacent current-cell wall
    # if its fitted offset is close to the expected centered side-wall offset.
    #
    # Expected centered offsets:
    #   left adjacent wall:  +grid_alignment_expected_half_width_m
    #   right adjacent wall: -grid_alignment_expected_half_width_m
    #
    # Example from lab:
    #   right offset -0.142 is adjacent for expected -0.125
    #   left offset +0.350 is not adjacent for expected +0.125
    grid_alignment_adjacent_wall_tolerance_m: 0.080

    # If both side-wall lines are individually adjacent, they are only used as
    # a paired left_right corridor if their observed width is plausible.
    # observed_width = left.offset_m - right.offset_m
    # expected_width = 2 * grid_alignment_expected_half_width_m
    grid_alignment_pair_width_tolerance_m: 0.080

    # Side wall candidate filter in robot base frame.
    # x is forward, y is left. A useful side wall must have enough points
    # beside the robot over a longitudinal span.
    grid_alignment_min_x_m: -0.18
    grid_alignment_max_x_m: 0.45

    # Reject walls too close to be reliable and far walls seen through openings.
    # This is intentionally conservative to avoid chasing distant cross-walls.
    grid_alignment_min_side_distance_m: 0.06
    grid_alignment_max_side_distance_m: 0.45

    # Minimum support for line fitting.
    grid_alignment_min_points: 8
    grid_alignment_min_span_x_m: 0.12

    # Reject noisy/curved/corner-like clusters.
    grid_alignment_max_rms_error_m: 0.025
    grid_alignment_max_abs_yaw_error_rad: 0.35

    # Clamp reported diagnostics so invalid estimates never explode logs.
    grid_alignment_max_reported_error_m: 0.30
    grid_alignment_max_reported_yaw_rad: 0.50

    # LiDAR grid-yaw correction for straight translation.
    # This is intentionally low-gain and heavily gated. It corrects heading only.
    # It does not command lateral strafe and it does not replace front/rear LiDAR distance stopping.
    grid_alignment_control_enabled: true
    grid_yaw_correction_enabled: true
    # Lab-tuned on 2026-07-02:
    # k=0.70 corrected weakly; k=1.20 visibly corrected more strongly without observed snaking.
    k_grid_yaw: 1.20
    max_grid_yaw_correction_radps: 0.060
    grid_yaw_min_confidence_for_control: 0.60
    grid_yaw_max_abs_error_for_control_rad: 0.20
    grid_yaw_memory_timeout_s: 0.35
    # When grid yaw correction is active, the odom/IMU heading-hold loop must
    # not fight the LiDAR grid-yaw correction. 0.0 means grid yaw fully owns
    # angular correction while valid; odom/IMU heading hold is fallback only.
    grid_yaw_active_heading_hold_scale: 0.0

    # Movement-parallelity diagnostics only. No lateral strafe correction in this change.
    grid_lateral_drift_diagnostics_enabled: true
    grid_lateral_drift_require_left_right: true
    grid_lateral_drift_min_confidence: 0.90

    # Timing
    timeout_margin_sec: 3.0
    wait_timeout_margin_sec: 1.0

    # Stop behavior
    stop_publish_duration_sec: 0.40
    stop_publish_rate_hz: 25.0
    settle_time_sec: 0.15

    # Final validation
    enforce_final_error: true
